<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        th {
            background-color: green;
            color: white;
        }
        th,td {
            border: 1px solid black;
            padding: 7px;
            
        }

    </style>
</head>
<body>
    <h1>
        Uso de Tabela Grande
    </h1>
    <!--
    Anatomia de uma Tabela
     >Thead
        TE, TD , TH
     >Tbody
        TE, TD , TH
     >Tfoot
        TE, TD , TH
    -->
<table>

    <thead>
        <tr>
            <th>Estado</th>
            <th>População</th>
        </tr>

    </thead>

    <tbody>
        <tr>
            <td>São Paulo</td>
            <td>46 081 801</td>
        </tr>
        <tr>
            <td>Minas Gerais</td>
            <td>21 322 691</td>
        </tr>
        <tr>
            <td>Rio de Janeiro</td>
            <td>17 219 679</td>
        </tr>

    </tbody>

    <tfoot>
        <tr>
            <th>Total de Habitantes</th>
            <td>0000</td>
        </tr>

    </tfoot>
</table>

    
</body>
</html>
